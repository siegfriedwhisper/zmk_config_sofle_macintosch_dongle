# Enable split keyboard support for passing indicator state to peripherals	
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y


CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# USB CDC-ACM 串口：接收器调参通道（网页 Web Serial 直连）
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
# 让出 CDC-ACM：关掉 console 与 UART 日志
CONFIG_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
