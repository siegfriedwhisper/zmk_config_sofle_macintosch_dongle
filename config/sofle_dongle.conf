CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# USB CDC-ACM 串口：接收器调参通道（网页 Web Serial 直连）
# ⚠️ board 级 conf 必须放在 config/ 根：ZMK 的 post_boards_shields.cmake 只搜
#    ${ZMK_CONFIG}/<board>.conf；放 config/boards/arm/<board>/<board>.conf 不会被加载。
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
# 让出 CDC-ACM：关掉 console 与 UART 日志
CONFIG_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
